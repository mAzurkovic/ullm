[project]
name = "ullm"
version = "0.1.0"
description = "A small GPT language model and chat assistant built from scratch."
requires-python = ">=3.12,<3.13"
dependencies = ["torch>=2.15"]

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
