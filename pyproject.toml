[project]
name = "ullm"
version = "0.1.0"
description = "A small GPT language model and chat assistant built from scratch."
requires-python = ">=3.12,<3.13"
dependencies = [
    "huggingface-hub>=2.4.0",
    "lm-eval>=0.4.13",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pyarrow>=26.0.1",
    "safetensors>=0.8.0",
    "tiktoken>=0.14.0",
    "torch>=2.15",
    "transformers>=5.23.0",
]

[project.scripts]
ullm = "ullm.cli:main"

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
